name: Déployer le site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Pages « projet » sert le site sous /SidSoundboard.
          # À vider (et ajuster SITE_URL) en cas de domaine personnalisé.
          NEXT_PUBLIC_BASE_PATH: /SidSoundboard
          NEXT_PUBLIC_SITE_ORIGIN: https://zubulmuk92.github.io

      # Pages must already be enabled, with "GitHub Actions" as the source,
      # in Settings > Pages. The action's `enablement` input cannot do it
      # here: it explicitly requires a token other than GITHUB_TOKEN.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
